[project]
name = "spokesfan-merchant-analytics-dashboard"
version = "1.0.0"
description = "Sentiment-analysis data pipeline for the Spokesfan merchant Power BI dashboard"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.3",
    "transformers==5.13.0",
    "torch==2.12.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
